[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-buddy"
version = "0.1.0"
description = "A voice quiz partner that quizzes you on your own notes, in your language, using Sarvam AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sarvamai>=0.1.37",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exam-buddy = "exam_buddy.cli:main"

[tool.setuptools.packages.find]
include = ["exam_buddy*"]
